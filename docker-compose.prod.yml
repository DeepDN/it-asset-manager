services:
  postgres:
    image: postgres:16-alpine
    container_name: it-asset-manager-db-prod
    environment:
      - POSTGRES_DB=it_assets_prod
      - POSTGRES_USER=${DB_USER:-it_assets_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-it_assets_pass}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - it-asset-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-it_assets_user} -d it_assets_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: it-asset-manager-prod
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-this}
      - DATABASE_URL=postgresql://${DB_USER:-it_assets_user}:${DB_PASSWORD:-it_assets_pass}@postgres:5432/it_assets_prod
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ASSET_BASE_URL=${ASSET_BASE_URL:-http://localhost}
    volumes:
      - uploads_prod_data:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - it-asset-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: it-asset-manager-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./static:/var/www/static:ro
      - ./logs/nginx:/var/log/nginx
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - it-asset-network
    restart: unless-stopped

volumes:
  postgres_prod_data:
  uploads_prod_data:

networks:
  it-asset-network:
    driver: bridge
