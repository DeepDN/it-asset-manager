name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: it_assets_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U test_user -d it_assets_test
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-flask pytest-cov
      - run: pytest tests/ -v --cov=it_asset_manager --cov-report=term-missing --cov-fail-under=60
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/it_assets_test
          FLASK_ENV: testing
          SECRET_KEY: test-secret

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install flake8 black
      - run: flake8 it_asset_manager/ --max-line-length=120
      - run: black --check it_asset_manager/

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target production -t assetpulse:latest .
