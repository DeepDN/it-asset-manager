{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h1 class="mb-2"><i class="fas fa-plus me-3"></i>Add Software License</h1>
            <p class="text-muted mb-0">Register a new software license in the inventory</p>
        </div>
        <div>
            <a href="{{ url_for('licenses.list_licenses') }}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>Back to Licenses
            </a>
        </div>
    </div>
</div>

<form method="POST">
    <div class="row">
        <div class="col-lg-8">
            <!-- License Information -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title mb-0">
                        <i class="fas fa-info-circle text-primary me-2"></i>License Information
                    </h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="license_name" class="form-label">License Name *</label>
                            <input type="text" class="form-control" id="license_name" name="license_name" required placeholder="e.g., Microsoft Office 365 Business">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="license_key" class="form-label">License Key</label>
                            <input type="text" class="form-control" id="license_key" name="license_key" placeholder="XXXXX-XXXXX-XXXXX-XXXXX">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="publisher" class="form-label">Publisher</label>
                            <input type="text" class="form-control" id="publisher" name="publisher" placeholder="e.g., Microsoft, Adobe, JetBrains">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="version" class="form-label">Version</label>
                            <input type="text" class="form-control" id="version" name="version" placeholder="e.g., 2021, v16.0">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="license_type" class="form-label">License Type *</label>
                            <select class="form-select" id="license_type" name="license_type" required>
                                <option value="">Select Type</option>
                                <option value="perpetual">Perpetual</option>
                                <option value="subscription">Subscription</option>
                                <option value="trial">Trial</option>
                                <option value="oem">OEM</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="total_seats" class="form-label">Total Seats *</label>
                            <input type="number" class="form-control" id="total_seats" name="total_seats" required min="1" placeholder="1">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="purchase_cost" class="form-label">Purchase Cost ($)</label>
                            <input type="number" class="form-control" id="purchase_cost" name="purchase_cost" step="0.01" placeholder="0.00">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="purchase_date" class="form-label">Purchase Date</label>
                            <input type="date" class="form-control" id="purchase_date" name="purchase_date">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Vendor Information -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title mb-0">
                        <i class="fas fa-building text-success me-2"></i>Vendor Information
                    </h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="vendor_name" class="form-label">Vendor Name</label>
                            <input type="text" class="form-control" id="vendor_name" name="vendor_name" placeholder="Vendor company name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="vendor_contact" class="form-label">Vendor Contact</label>
                            <input type="text" class="form-control" id="vendor_contact" name="vendor_contact" placeholder="Contact person or email">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <!-- Dates & Status -->
            <div class="card mb-4">
                <div class="card-header">
                    <h6 class="card-title mb-0">
                        <i class="fas fa-calendar text-warning me-2"></i>Important Dates
                    </h6>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="expiration_date" class="form-label">Expiration Date</label>
                        <input type="date" class="form-control" id="expiration_date" name="expiration_date">
                        <div class="form-text">Leave blank for perpetual licenses</div>
                    </div>
                    <div class="mb-3">
                        <label for="support_expiry" class="form-label">Support Expiry</label>
                        <input type="date" class="form-control" id="support_expiry" name="support_expiry">
                    </div>
                </div>
            </div>

            <!-- Notes -->
            <div class="card mb-4">
                <div class="card-header">
                    <h6 class="card-title mb-0">
                        <i class="fas fa-sticky-note text-secondary me-2"></i>Notes
                    </h6>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="notes" class="form-label">Additional Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="5" placeholder="Any additional information about this license..."></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('licenses.list_licenses') }}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Save License
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
{% endblock %}
