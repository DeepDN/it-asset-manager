{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h1 class="mb-2"><i class="fas fa-user-plus me-3"></i>Add User</h1>
            <p class="text-muted mb-0">Create a new user account</p>
        </div>
        <a href="{{ url_for('admin.list_users') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Back to Users
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header">
                <h6 class="card-title mb-0"><i class="fas fa-user text-primary me-2"></i>User Details</h6>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" required minlength="3"
                               placeholder="Enter username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" required minlength="6"
                               placeholder="Enter password (min 6 chars)">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="user@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select">
                            {% for role in roles %}
                            <option value="{{ role }}" {% if role == 'employee' %}selected{% endif %}>
                                {{ role|replace('_', ' ')|title }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <select name="department" class="form-select">
                            <option value="">Select Department</option>
                            <option value="Engineering">Engineering</option>
                            <option value="IT">IT / Information Technology</option>
                            <option value="HR">HR / Human Resources</option>
                            <option value="Finance">Finance & Accounting</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Sales">Sales</option>
                            <option value="Legal">Legal</option>
                            <option value="Operations">Operations</option>
                            <option value="Product">Product Management</option>
                            <option value="Design">Design / UX</option>
                            <option value="R&D">Research & Development</option>
                            <option value="Support">Customer Support</option>
                            <option value="Administration">Administration</option>
                            <option value="Executive">Executive Management</option>
                            <option value="Data">Data & Analytics</option>
                            <option value="Security">Security / InfoSec</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control" placeholder="e.g. +1-555-0123">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Create User
                        </button>
                        <a href="{{ url_for('admin.list_users') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
