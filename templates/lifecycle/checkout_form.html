{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h1 class="mb-2"><i class="fas fa-sign-out-alt me-3"></i>Checkout Asset</h1>
            <p class="text-muted mb-0">Assign an asset to a user</p>
        </div>
        <div>
            <a href="{{ url_for('lifecycle.checkout_list') }}" class="btn btn-outline-secondary">
                <i class="fas fa-list me-2"></i>View Checkouts
            </a>
        </div>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">
                    <i class="fas fa-info-circle text-primary me-2"></i>Checkout Details
                </h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="asset_id" class="form-label">Select Asset *</label>
                        <select class="form-select" id="asset_id" name="asset_id" required>
                            <option value="">-- Choose an available asset --</option>
                            {% for a in assets %}
                            <option value="{{ a.id }}">
                                {{ a.asset_tag }} &mdash; {{ a.asset_type.title() }}
                                {% if a.brand %} ({{ a.brand }}{% if a.model %} {{ a.model }}{% endif %}){% endif %}
                                {% if a.serial_number %} &mdash; S/N: {{ a.serial_number }}{% endif %}
                            </option>
                            {% endfor %}
                        </select>
                        {% if not assets %}
                        <div class="form-text text-warning">
                            <i class="fas fa-exclamation-triangle me-1"></i>No assets available for checkout.
                        </div>
                        {% endif %}
                    </div>

                    <div class="mb-3">
                        <label for="assigned_user" class="form-label">Assigned User *</label>
                        <select class="form-select" id="assigned_user" name="assigned_user" required>
                            <option value="">-- Select User --</option>
                            {% for u in users %}
                            <option value="{{ u.username }}">{{ u.username }}{% if u.department %} ({{ u.department }}){% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="expected_return_date" class="form-label">Expected Return Date</label>
                        <input type="date" class="form-control" id="expected_return_date" name="expected_return_date"
                               value="{{ today }}">
                    </div>

                    <div class="mb-3">
                        <label for="condition" class="form-label">Condition at Checkout</label>
                        <select class="form-select" id="condition" name="condition">
                            <option value="">-- Select Condition --</option>
                            <option value="excellent">Excellent</option>
                            <option value="good" selected>Good</option>
                            <option value="fair">Fair</option>
                            <option value="poor">Poor</option>
                            <option value="damaged">Damaged</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3"
                                  placeholder="Any additional notes about this checkout"></textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('lifecycle.checkout_list') }}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-check me-2"></i>Checkout Asset
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
